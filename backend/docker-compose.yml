services:
  postgres:
    image: postgres:17
    container_name: investment-tracker-postgres
    environment:
      POSTGRES_DB: investment_tracker
      POSTGRES_USER: investment_tracker
      POSTGRES_PASSWORD: investment_tracker
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U investment_tracker -d investment_tracker"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Opt-in: `docker compose --profile full up --build`
  # Default `docker compose up` runs Postgres only.
  app:
    profiles: ["full"]
    build:
      # Repository root: the image builds the SPA and the API together.
      context: ..
      dockerfile: backend/Dockerfile
    container_name: investment-tracker-app
    depends_on:
      postgres:
        condition: service_healthy
    # No SPRING_PROFILES_ACTIVE: the default configuration is the deployable one, and `local`
    # exists only for laptop runs outside a container.
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: investment_tracker
      POSTGRES_USER: investment_tracker
      POSTGRES_PASSWORD: investment_tracker
      APP_AUTH_USERNAME: ${APP_AUTH_USERNAME:-tracker}
      # bcrypt hash of the single credential; generate one with
      # `docker run --rm httpd:alpine htpasswd -nbBC 10 "" <password> | cut -d: -f2`
      APP_AUTH_PASSWORD_HASH: ${APP_AUTH_PASSWORD_HASH:?set APP_AUTH_PASSWORD_HASH to a bcrypt hash}
      ALPHAVANTAGE_API_KEY: ${ALPHAVANTAGE_API_KEY:-}
    ports:
      - "8080:8080"

volumes:
  postgres_data:
