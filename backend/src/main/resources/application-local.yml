# Laptop-only overrides: point at the compose Postgres and use its development credentials.
# Everything else is inherited from application.yml.
spring:
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:investment_tracker}
    username: ${POSTGRES_USER:investment_tracker}
    password: ${POSTGRES_PASSWORD:investment_tracker}

app:
  auth:
    # Off for laptop development so `spring-boot:run` needs no credentials. Auth is on by
    # default everywhere else; deployed configuration must never set this.
    enabled: false
