spring:
  datasource:
    url: jdbc:h2:mem:investment_tracker_${random.uuid};MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        # Mirror the native image, which has no runtime bytecode provider, so the test suite fails
        # on anything that would need a runtime-generated Hibernate proxy.
        bytecode:
          provider: none
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

app:
  auth:
    # The existing controller tests assert on payloads, not on authentication. SecurityConfigTest
    # turns auth back on with @TestPropertySource so the protected chain stays covered.
    enabled: false
